name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate build artifacts (DNR rules + vendored engine + icons)
        run: |
          node scripts/gen-dnr-rules.js
          node scripts/sync-shared.js
          node scripts/gen-icons.js

      - name: Ensure generated artifacts are committed and up to date
        run: |
          git diff --exit-code -- extension/rules extension/vendor extension/icons \
            || (echo "Generated extension assets are stale. Run 'npm run build && node scripts/gen-icons.js' and commit." && exit 1)

      - name: Run test suite
        run: npm test

      - name: Parse-check browser scripts (no chrome runtime in CI)
        run: |
          for f in extension/background.js extension/content.js extension/blocked.js extension/popup.js extension/options.js; do
            node --check "$f"
          done

      - name: End-to-end demo
        run: npm run demo
